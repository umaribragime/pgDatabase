spring.application.name=ecommerce-api

# Defaults match docker-compose.yml. Environment variables can override them
# when the application runs outside the local Docker setup.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changemeinprod!}

# Flyway owns schema creation and updates. Hibernate only verifies the schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
